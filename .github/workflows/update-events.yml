name: Update Events from Luma

on:
  schedule:
    # Runs every day at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-events:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test event sync
        run: node --test scripts/luma-events.test.mjs

      - name: Run scraper
        run: node scripts/scrape-events.js

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code public/events.json || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f public/events.json
          git commit -m "chore: update events from Luma"
          git push

      # Commits made with GITHUB_TOKEN do not trigger the push deployment workflow.
      # Publish the refreshed event data as part of this scheduled run instead.
      - name: Install dependencies
        if: steps.git-check.outputs.changes == 'true'
        run: npm ci

      - name: Build refreshed site
        if: steps.git-check.outputs.changes == 'true'
        run: npm run build

      - name: Deploy refreshed events
        if: steps.git-check.outputs.changes == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
